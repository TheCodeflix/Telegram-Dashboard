<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Telegram Web Dashboard" />
    <meta name="theme-color" content="#0088cc" />
    <title>{% block title %}Telegram Dashboard{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
          crossorigin="anonymous" />

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plh7eqjFgr+BNts8w1l3rtWa1rI3A=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=3) }}" />

    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay" class="d-none">
    <div class="loading-inner">
        <div class="spinner-border text-light" role="status"></div>
        <p class="mt-3 text-light fw-semibold">Loading…</p>
    </div>
</div>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
        <a class="navbar-brand" href="/">
            <span class="brand-mark"><i class="fab fa-telegram"></i></span>
            <span>Telegram Dashboard</span>
        </a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Home</a>
            </li>
        </ul>
    </div>
</nav>

<!-- Flash / alert container -->
<div id="alert-container" class="container mt-3" role="alert" aria-live="polite"></div>

<!-- Main Content -->
<main class="container">
    {% block content %}{% endblock %}
</main>

<!-- Footer -->
<footer class="text-center mt-auto">
    <div class="container">
        <span>
            <i class="fab fa-telegram me-1"></i>
            Telegram Web Dashboard &mdash; Built with Flask &amp; Pyrogram
        </span>
    </div>
</footer>

<!-- Toast container (bottom-right) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"
     style="z-index:1100;"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='script.js', v=3) }}"></script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
